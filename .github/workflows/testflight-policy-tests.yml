name: TestFlight policy tests
on:
  pull_request:
    paths:
      - '.github/workflows/*testflight*.yml'
      - 'scripts/*testflight*'
      - 'tests/testflight_*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 tests/testflight_gate.py
      - run: ruby tests/testflight_audience.rb
