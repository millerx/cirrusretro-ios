name: Native iOS
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    # The approved budget covers standard public-repository runners.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: xcodebuild -version && cmake --version
      - run: scripts/build-ios-core
      - name: Compile universal app for an unsigned ARM64 device
        run: |
          xcodebuild -project ios/CirrusRetro.xcodeproj -scheme CirrusRetro -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Run app-hosted tests on an ARM64 iOS simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, entries in reversed(sorted(devices.items()))
                     if ".iOS-" in runtime for d in entries if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/CirrusRetro.xcodeproj -scheme CirrusRetro -configuration Debug \
            -destination "platform=iOS Simulator,id=$udid" -parallel-testing-enabled NO test
