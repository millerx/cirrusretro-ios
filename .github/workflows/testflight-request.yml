name: Owner TestFlight request
on:
  push:
    tags: ['owner-testflight-*']

permissions: {}
jobs:
  request:
    runs-on: ubuntu-24.04
    steps:
      - name: Request delivery on creation by the owner
        env:
          CREATED: ${{ github.event.created }}
          DELETED: ${{ github.event.deleted }}
        run: test "$GITHUB_ACTOR_ID" = 1734980 && test "$CREATED" = true && test "$DELETED" = false
