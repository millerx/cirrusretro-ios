name: Portable NSF
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        config: [Release, Sanitizers]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Configure
        shell: bash
        run: |
          cc --version
          c++ --version
          cmake --version
          args=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "${{ matrix.config }}" == Sanitizers ]]; then
            flags="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
            args=(-DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" -DCMAKE_EXE_LINKER_FLAGS=-no-pie)
          fi
          cmake -S . -B build -DBUILD_TESTING=ON "${args[@]}"
          git -C build/_deps/game_music_emu-src rev-parse HEAD
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error
