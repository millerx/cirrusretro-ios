name: Owner TestFlight
on:
  push:
    tags: ['owner-testflight-*']

permissions:
  contents: read

concurrency:
  group: owner-testflight
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'millerx/cirrusretro-ios' && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 35
    environment: owner-testflight
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: scripts/build-ios-core
      - run: scripts/archive-ios "$RUNNER_TEMP/CirrusRetro.xcarchive" "$GITHUB_RUN_NUMBER"
      - name: Manually sign and upload for internal testing only
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          APP_STORE_PROFILE_BASE64: ${{ secrets.APP_STORE_PROFILE_BASE64 }}
        run: scripts/upload-owner-testflight "$RUNNER_TEMP/CirrusRetro.xcarchive"
